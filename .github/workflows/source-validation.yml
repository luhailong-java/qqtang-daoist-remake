name: Source validation
on:
  push:
    branches: ["codex/**"]
    paths:
      - "src/**"
      - "server/**"
      - "scripts/**"
      - "tests/**"
      - "*.html"
      - "package.json"
      - ".github/**"
      - "references/qqtang-map-data/motion-contract/inspect-packed-metadata.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified2026-10-28
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install fixture dependency
        run: python -m pip install --no-cache-dir "Pillow==12.0.0"
      - name: Node engine, server, map and cutout checks
        run: npm test
      - name: Independent image-container and UI-constant fixtures
        run: |
          python tests/dimg-reference.test.py
          python tests/dimg-metadata-only.test.py
          python tests/legacy-ui-constants.test.py
      - name: Python source syntax
        run: python -m compileall -q scripts tests references/qqtang-map-data/motion-contract/inspect-packed-metadata.py
      - name: Package with baseline published assets
        run: npm run build
