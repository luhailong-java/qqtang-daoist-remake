<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道童动作小样 · 制作检查</title><link rel="stylesheet" href="./src/rig-preview.css"></head>
<body><main><header><h1>道童动作小样</h1><p>新绘部件与关节关键帧的实验页。只检查真实方向、接缝和步态；未接入主游戏。</p><a href="./art.html">返回素材检查</a></header>
<section class="controls" aria-label="小样选项"><label>背景<select id="rig-background"><option value="ivory">暖米白</option><option value="dark">深青</option><option value="checker">透明棋盘</option></select></label><label>画布显示<select id="rig-size"><option value="96">96 像素</option><option value="384">4 倍近看</option></select></label><label>预览速度<select id="rig-speed"><option value="1">1 倍</option><option value="0.25">0.25 倍慢放</option></select></label><label><input id="rig-joints" type="checkbox" checked>显示关节点</label><button id="rig-play" type="button" aria-pressed="false">播放</button><button id="rig-idle" type="button">恢复待机</button><button id="rig-reload" type="button">重新载入已保存部件</button></section>
<p id="rig-status" role="status">正在读取实验部件状态…</p><div class="stage" id="rig-stage" data-background="ivory"><canvas id="rig-canvas" width="800" height="600" aria-label="道童E方向动作小样"></canvas></div>
<label class="phase-label">检查相位<input id="rig-phase" type="range" min="0" max="1000" value="0"></label><div class="contacts"><button id="rig-contact-a" type="button">接触 A · 0%</button><button id="rig-contact-b" type="button">接触 B · 50%</button></div><p id="rig-contact-evidence"></p>
<details><summary>部件来源与待验边界</summary><pre id="rig-record"></pre></details><footer>运动来源为 procedural_skeletal_animation。预览节奏是本项目视觉参数，原版时序另行核实；部件生成、程序运动与最终验收分别记录。</footer></main><script type="module" src="./src/rig-preview.js"></script></body></html>
