<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美术制作检查 · 灵葫大作战</title><link rel="stylesheet" href="./src/art-review.css"><link rel="stylesheet" href="./src/art-review-nameplates.css"></head>
<body><main class="review-shell"><header><div><p class="eyebrow">美术制作检查</p><h1>自有道家 Q 版素材</h1><p>查看真实候选、透明背景与来源。此页的库存数量不代表整款游戏已完成。</p></div><nav aria-label="返回"><a href="./index.html">游戏</a><a href="./maps.html">地图检查</a></nav></header>
<section class="review-toolbar" aria-label="检查选项"><label>类别<select id="review-kind"><option value="items">基础道具</option><option value="battlefield">对局拾取物</option><option value="skills">技能图标</option><option value="food">食物</option><option value="forge">锻造材料</option><option value="petcards">自有仙灵卡</option><option value="headAdornments">头顶饰品图标</option><option value="headWorld">头顶饰品世界帧</option><option value="surroundings">护罩与仙驾图标</option><option value="cards">任务与关系道具</option><option value="platform">功能与召令道具</option><option value="nameplates">长版名片装饰</option><option value="shortNameplates">短版名片装饰</option><option value="nameplateIcons">名片装饰图标</option><option value="roster">自有静态人物</option><option value="portraits">20角色头像</option><option value="uiExtra">新增功能图标</option><option value="transformations">临时变身</option><option value="characters">角色原画与姿态</option><option value="creatures">探险实体</option><option value="effects">糖泡与火焰序列</option><option value="pickupSequences">拾取物动画候选</option><option value="mapSequences">地图多帧候选</option></select></label><label>背景<select id="review-background"><option value="ivory">暖米白</option><option value="dark">深青</option><option value="checker">透明棋盘</option></select></label><label class="review-search">查找<input id="review-search" type="search" placeholder="名称或编号" autocomplete="off"></label></section>
<p id="review-status" role="status" aria-live="polite">正在载入…</p><div id="review-pagination" class="effect-controls"><button id="review-previous" type="button">上一页</button><span id="review-page"></span><button id="review-next" type="button">下一页</button></div><section id="review-grid" class="review-grid" aria-label="候选素材"></section>
<section id="effect-panel" class="effect-panel" hidden aria-label="序列检查"><div class="effect-controls"><label>候选序列<select id="effect-select"></select></label><label>每帧预览时长<select id="effect-pace"><option value="80">80 毫秒</option><option value="120" selected>120 毫秒</option><option value="180">180 毫秒</option></select></label><button id="effect-play" type="button" aria-pressed="false">播放</button><button id="effect-step" type="button">下一帧</button></div><p>这里的节奏只用于检查画面，原版播放时序仍待核实。原始空帧保留为空白。偏移按源frameOffset作相对包络检查，不当作游戏绑定或地图锚点。</p><div class="effect-stage" data-background="ivory"><canvas id="effect-canvas" width="640" height="640" aria-label="当前候选帧"></canvas></div><p id="effect-state" role="status"></p><details><summary>该序列的来源与规格</summary><pre id="effect-details"></pre></details></section>
<footer>所有条目均为制作候选。身份、比例、透明边缘、循环、控件状态与运行验收分别记录。当前本机重型验收按资源协调暂停，未将暂停项目改记通过。</footer></main><script type="module" src="./src/art-review.js"></script></body></html>
